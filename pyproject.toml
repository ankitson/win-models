[project]
name = "win-models"
version = "0.1.0"
description = "Local Windows model server helpers for llama.cpp and Unsloth Studio."
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30,<0.31",
    "jinja2>=3.1,<4",
]

[project.scripts]
win-models = "win_models.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
